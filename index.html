<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Turmas - 34 Alunos no 1°A</title>
    <style>
        /* Reset e Estilo Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a3a5a;
            color: white;
            min-height: 100vh;
        }

        /* Menu Superior */
        header {
            background-color: #000000;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4da3ff;
            cursor: pointer;
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Painel de Turmas */
        #view-home { display: block; text-align: center; }

        .grid-turmas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card-turma {
            background-color: #2c5282;
            border: 2px solid #4da3ff;
            border-radius: 15px;
            padding: 2rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .card-turma:hover {
            transform: translateY(-5px);
            background-color: #3182ce;
        }

        /* Área de Detalhes */
        #view-detalhes {
            display: none;
            background-color: #264a73;
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid #4da3ff;
        }

        .btn-voltar {
            background-color: #000;
            color: white;
            border: 1px solid #4da3ff;
            padding: 8px 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* Tabela de Alunos */
        .lista-header {
            display: grid;
            grid-template-columns: 50px 2fr 2fr 100px;
            padding: 12px;
            background: #000;
            border-radius: 8px 8px 0 0;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #4da3ff;
            gap: 15px;
        }

        .lista-alunos {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(77, 163, 255, 0.3);
            border-top: none;
            border-radius: 0 0 10px 10px;
        }

        .item-aluno {
            display: grid;
            grid-template-columns: 50px 2fr 2fr 100px;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(77, 163, 255, 0.1);
            gap: 15px;
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(77, 163, 255, 0.2);
            color: white;
            padding: 6px;
            border-radius: 4px;
            width: 100%;
        }

        input:focus { border-color: #4da3ff; outline: none; background: rgba(255,255,255,0.1); }

        .btn-link {
            background-color: #4da3ff;
            color: #000;
            text-decoration: none;
            text-align: center;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .btn-link.desativado { background-color: #555; opacity: 0.4; pointer-events: none; }

        footer { text-align: center; padding: 2rem; opacity: 0.4; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="mostrarHome()">PAINEL DE PORTFÓLIOS</div>
        <div style="font-size: 0.8rem; color: #4da3ff;">💾 Alterações salvas no seu navegador</div>
    </header>

    <main>
        <section id="view-home">
            <h1>Controle de Turmas</h1>
            <div class="grid-turmas">
                <div class="card-turma" onclick="abrirTurma('1A', 34)">
                    <h2>1°A</h2>
                    <p>34 Alunos</p>
                </div>
                <div class="card-turma" onclick="abrirTurma('1B', 30)">
                    <h2>1°B</h2>
                    <p>30 Alunos</p>
                </div>
                <div class="card-turma" onclick="abrirTurma('2A', 20)">
                    <h2>2°A</h2>
                    <p>20 Alunos</p>
                </div>
                <div class="card-turma" onclick="abrirTurma('3A', 31)">
                    <h2>3°A</h2>
                    <p>31 Alunos</p>
                </div>
            </div>
        </section>

        <section id="view-detalhes">
            <button class="btn-voltar" onclick="mostrarHome()">← Voltar</button>
            <h1 id="titulo-turma">Turma</h1>
            
            <div class="lista-header" style="margin-top: 20px;">
                <div>Nº</div>
                <div>Nome do Aluno</div>
                <div>Link do Portfólio (URL)</div>
                <div>Ação</div>
            </div>
            <div class="lista-alunos" id="container-lista">
                </div>
        </section>
    </main>

    <footer>
        &copy; 2026 - Sistema Gerenciador Acadêmico
    </footer>

    <script>
        let turmaAtiva = '';

        function abrirTurma(idTurma, qtd) {
            turmaAtiva = idTurma;
            document.getElementById('view-home').style.display = 'none';
            document.getElementById('view-detalhes').style.display = 'block';
            document.getElementById('titulo-turma').innerText = 'Turma: ' + idTurma.replace('A', '° A').replace('B', '° B');

            const container = document.getElementById('container-lista');
            container.innerHTML = '';

            const bdLocal = JSON.parse(localStorage.getItem('port_data_' + idTurma)) || {};

            for (let i = 1; i <= qtd; i++) {
                const dados = bdLocal[i] || { nome: `Aluno ${i}`, link: '' };
                const temLink = dados.link.trim() !== "";

                const item = document.createElement('div');
                item.className = 'item-aluno';
                item.innerHTML = `
                    <div style="font-weight:bold; color:#4da3ff;">${i}</div>
                    <input type="text" value="${dados.nome}" onchange="salvar(${i}, 'nome', this.value)" placeholder="Nome">
                    <input type="text" value="${dados.link}" onchange="salvar(${i}, 'link', this.value)" placeholder="Cole a URL aqui">
                    <a href="${dados.link}" target="_blank" class="btn-link ${temLink ? '' : 'desativado'}" id="btn-${i}">Acessar</a>
                `;
                container.appendChild(item);
            }
        }

        function salvar(index, campo, valor) {
            let bdLocal = JSON.parse(localStorage.getItem('port_data_' + turmaAtiva)) || {};
            if (!bdLocal[index]) bdLocal[index] = { nome: '', link: '' };
            
            bdLocal[index][campo] = valor;
            localStorage.setItem('port_data_' + turmaAtiva, JSON.stringify(bdLocal));

            if (campo === 'link') {
                const btn = document.getElementById(`btn-${index}`);
                btn.href = valor;
                valor.trim() !== "" ? btn.classList.remove('desativado') : btn.classList.add('desativado');
            }
        }

        function mostrarHome() {
            document.getElementById('view-home').style.display = 'block';
            document.getElementById('view-detalhes').style.display = 'none';
        }
    </script>
</body>
</html>
